seguridad:
  dast: true
  zap_reglas: .github/zap-rules.tsv
  bloquear_en: [CRITICAL, HIGH]   # se puede endurecer (añadir MEDIUM), nunca relajar
  # id, herramienta, componente, justificacion, aprobado_por, creado, vence
  excepciones:
    - id: CKV_GHA_7
      herramienta: checkov
      justificacion: >-
        Regla SLSA sobre workflow_dispatch con inputs, en los DOS workflows de
        este repositorio que lo declaran. Revisado el 2026-10-01 uno por uno:
        ningun input se interpola en un script. Hasta esa fecha esta
        justificacion solo hablaba de release.yml, aunque la excepcion se
        compara por (herramienta, id) y por tanto tapaba tambien el segundo;
        se amplia para que no quede ningun workflow exceptuado sin analisis
        escrito. Las fechas no se mueven: reafirmar un analisis no extiende la
        vigencia.
        (1) release.yml: `tipo` es un choice de [auto, patch, minor, major] y
        `prerelease` un boolean, asi que GitHub rechaza cualquier otro valor
        antes de que el workflow arranque, y `tipo` llega al shell por variable
        de entorno (TIPO_ENTRADA), no interpolado. El workflow no produce el
        artefacto de build: solo crea el tag y la release, corre solo desde
        main y con permissions contents: read.
        (2) ci-node-cloudrun.yml: `confirmar` solo se compara con la cadena
        DESPLEGAR dentro de una condicion `if:` y su valor no llega a ningun
        script; `tag` llega a actions/checkout (`ref:`), al `ref` del reusable
        y a la variable de entorno TAG, que el shell usa siempre entre
        comillas. Antes de desplegar a produccion se exige que el tag exista
        (rev-parse --verify refs/tags/), que no tenga guion —lo que descarta
        los prerelease y cualquier valor que empiece por '-'— y que sea
        ancestro de origin/main, mas firma verificable si
        TAG_FIRMADO_REQUERIDO.
        En ambos casos solo quien tiene permiso de escritura puede lanzar un
        workflow_dispatch, y ese permiso ya permite ejecutar el workflow de su
        propia rama. Quitar los inputs obligaria a editar el workflow en cada
        release o despliegue manual.
      aprobado_por: Andres Alberdi (propietario)
      creado: "2026-09-07"
      vence: "2026-12-06"
    - id: undici-types@6.21.0
      herramienta: pnpm
      componente: chatbotrag
      justificacion: >-
        Exención de trustPolicy con version exacta (un nombre a secas eximiria a
        todas las versiones del paquete, presentes y futuras). La fija
        @types/node@22.20.1 mediante el rango ~6.21.0 y carece de atestacion de
        provenance por ser anterior a la publicacion por OIDC del paquete, que
        rige desde la linea 7.x. Verificado contra el registro npm: la publico
        matteo.collina, mantenedor legitimo de undici; no es una toma de control.
        Se retira al subir @types/node a una version que use undici-types 7.x.
      aprobado_por: Andres Alberdi (propietario)
      creado: "2026-09-07"
      vence: "2026-12-06"
