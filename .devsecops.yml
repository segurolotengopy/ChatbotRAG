# Manifiesto del estándar DevSecOps (esquema: 02-pipelines/config/devsecops.schema.json;
# convenciones: 00-gobernanza/00-convenciones.md; generado por bootstrap-repo.sh v2.0)
version: 1
proyecto: chatbotrag
modo: A            # A | B | B0 (ver 00-gobernanza/03-ambientes-modos-y-aprobaciones.md)
cobertura_minima: 70
componentes:
  - nombre: chatbotrag
    ruta: ./
    stack: node
    proveedor: cloudrun
    ambientes:
      staging:
        proyecto: chatbotrag-staging   # A CONFIRMAR por el propietario (ID real del proyecto GCP)
        url: https://chatbotrag-staging.example.com   # A CONFIRMAR: URL de Cloud Run de staging
        region: us-central1
        servicio: chatbotrag
        repositorio: chatbotrag
      production:
        proyecto: chatbotrag-prod   # A CONFIRMAR
        url: https://chatbotrag.example.com   # A CONFIRMAR
        region: us-central1
        servicio: chatbotrag
        repositorio: chatbotrag
seguridad:
  dast: true
  zap_reglas: .github/zap-rules.tsv
  bloquear_en: [CRITICAL, HIGH]   # se puede endurecer (añadir MEDIUM), nunca relajar
  # id, herramienta, componente, justificacion, aprobado_por, creado, vence
  excepciones:
    - id: CKV_GHA_7
      herramienta: checkov
      justificacion: >-
        Regla SLSA sobre .github/workflows/release.yml: exige que
        workflow_dispatch no tenga inputs. Los dos que declara son de tipo
        cerrado, no texto libre: `tipo` es un choice de [auto, patch, minor,
        major] y `prerelease` un boolean, asi que no admiten un valor
        arbitrario. `tipo` llega al shell por variable de entorno
        (TIPO_ENTRADA) y no interpolado en el script, que es el patron que
        evita la inyeccion. El workflow no produce el artefacto de build: solo
        crea el tag y la release; la imagen la construye ci-node-cloudrun.yml
        disparado por ese tag. Ademas corre solo desde main
        (if: github.ref == refs/heads/main) y con permissions contents: read.
        Quitar los inputs eliminaria la eleccion del incremento de version y la
        marca de pre-release. Es una regla del estandar compartido: la solucion
        de fondo corresponde a SeguridadGeneral, no a este repositorio.
      aprobado_por: Andres Alberdi (propietario)
      creado: "2026-09-07"
      vence: "2026-12-06"
    - id: undici-types@6.21.0
      herramienta: pnpm
      componente: chatbotrag
      justificacion: >-
        Exención de trustPolicy con version exacta (un nombre a secas eximiria a
        todas las versiones del paquete, presentes y futuras). La fija
        @types/node@22.20.1 mediante el rango ~6.21.0 y carece de atestacion de
        provenance por ser anterior a la publicacion por OIDC del paquete, que
        rige desde la linea 7.x. Verificado contra el registro npm: la publico
        matteo.collina, mantenedor legitimo de undici; no es una toma de control.
        Se retira al subir @types/node a una version que use undici-types 7.x.
      aprobado_por: Andres Alberdi (propietario)
      creado: "2026-09-07"
      vence: "2026-12-06"
    - id: CVE-2026-84373
      herramienta: osv-scanner
      componente: chatbotrag
      justificacion: >-
        GHSA-82fw-gwwq-j7x9: lectura arbitraria de archivos por travesia de
        rutas en @vitest/mocker, alcanzado por vitest 3.2.7. Severidad MODERATE
        (CVSS 3.1 AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N). No hay correccion en la
        linea 3.x: la primera version corregida es la 4.1.11, es decir una
        actualizacion mayor del marco de pruebas, que toca los 8 archivos de
        prueba del monorepo y la configuracion de cobertura. Es dependencia de
        desarrollo: no entra en la imagen de Cloud Run (la etapa final se arma
        con `pnpm --filter servicio deploy --prod`) ni se ejecuta en
        produccion. El vector exige un mock
        `redirect` con ruta controlada por un tercero; este repositorio no usa
        redirect en ninguna prueba, verificado sobre los 8 archivos *.prueba.ts.
        En CI osv-scanner es informativo y no bloqueante, y MEDIUM esta por
        debajo de bloquear_en, asi que esta entrada no desbloquea nada: deja
        registrada la decision y su fecha. Se retira al migrar a vitest 4 en su
        propia rama, que es la correccion de fondo.
      aprobado_por: Andres Alberdi (propietario)
      creado: "2026-09-20"
      vence: "2026-12-19"
